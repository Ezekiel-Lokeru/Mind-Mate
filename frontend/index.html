<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mind-Mate — Frontend</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <div class="brand">MindMate</div>
      <nav class="nav" aria-hidden="true">A small companion for emotional well‑being</nav>
      <div class="header-actions">
        <button id="themeToggle" class="btn-ghost" aria-pressed="false" title="Toggle light/dark theme">Toggle theme</button>
      </div>
    </header>

    <div class="grid">
      <section class="card" id="entry" role="region" aria-labelledby="entryTitle">
        <h2 id="entryTitle">New Journal Entry</h2>
        <details id="advanced" class="advanced" aria-expanded="false">
          <summary>Advanced options (optional)</summary>
          <div class="field"><label for="user_id">User ID</label><input id="user_id" aria-label="User ID" value="cli_test" /></div>
          <div class="field"><label for="score">Score</label><input id="score" type="number" step="0.01" aria-label="Score" value="0.5"/></div>
          <div class="field"><label for="tags">Tags (comma separated)</label><input id="tags" aria-label="Tags" value="anxiety" /></div>
        </details>
        <div class="field"><label for="text">Text</label><textarea id="text" aria-label="Journal text">I am stressed about a deadline.</textarea></div>
        <div class="actions"><button id="submit" class="btn-primary">Submit Entry</button></div>
        <div id="response" class="boxed response" aria-live="polite">No response yet</div>
      </section>

      <section class="card" id="trends" role="region" aria-labelledby="trendsTitle">
        <h2 id="trendsTitle">Trends</h2>
        <div class="actions"><button id="refresh" class="btn-ghost">Refresh Trends</button></div>
        <canvas id="trendsChart" height="160" role="img" aria-label="Emotion trends chart"></canvas>
        <pre id="trendsOut" class="boxed small" aria-live="polite">(no data)</pre>
      </section>
    </div>
    <footer class="foot">Local prototype — for demos only</footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="app.js"></script>
  <div id="toast-container" aria-live="assertive" aria-atomic="true"></div>
</body>
</html>
